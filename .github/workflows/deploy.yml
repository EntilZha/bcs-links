name: Build and deploy to GitHub Pages

# Served at https://bcs.pedro.ai (public/CNAME). Every push to main is tested on phone-sized
# browsers and, if everything passes, deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as local development (pixi.toml / pixi.lock).
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Install npm dependencies
        run: pixi run npm ci

      - name: Type-check
        run: pixi run check

      - name: Unit tests
        run: pixi run test

      # The suite builds the site itself and serves it on :4322 (see playwright.config.ts).
      # WebKit is needed for the iPhone projects, Chromium for the Pixel one.
      - name: Install Playwright browsers
        run: pixi run npx playwright install --with-deps chromium webkit

      - name: Browser tests (iPhone 13, iPhone 17, Pixel 7 + axe)
        run: pixi run test-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: pixi run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
